<!DOCTYPE html>
<html lang="eng">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="container">
            <div id="main-area">
                <h1>Metric/Imperial Unit Conversion</h1>
                <input type="number" step="0.01"/>
                <button id="convert-btn">Convert</button>
            </div>
            <div id="result-area">
                <div id="length-div" class="result-div">
                    <h2>Length (Meter/Feet)</h2>
                    <p id="length-result" class="inital-values">1 meter = 3.281 feet |1 feet = 0.304 meter</p>
                </div>
                <div id="volume-div" class="result-div">
                    <h2>Volume (Liters/Gallons)</h2>
                    <p id="volume-result" class="inital-values">1 liter = 0.264 gallon |1 gallon = 3.785 liter</p>
                </div>
                <div id="mass-div" class="result-div">
                    <h2>Mass (Kilograms/Pounds)</h2>
                    <p id="mass-result" class="inital-values">1 Kilogram = 2.204 pound |1 pound = 0.453 kilogram</p>
                </div>
                <footer>
                    <p>these are approx values</p>
                </footer>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
